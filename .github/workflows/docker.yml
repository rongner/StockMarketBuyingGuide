name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal

  build-api:
    name: Build API image
    needs: test
    uses: rongner-portfolio/workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: stockmarketbuyingguide-api
      context: .
      dockerfile: src/StockMarketBuyingGuide.Api/Dockerfile
    permissions:
      contents: read
      packages: write

  build-web:
    name: Build Web image
    needs: test
    uses: rongner-portfolio/workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: stockmarketbuyingguide-web
      context: src/StockMarketBuyingGuide.Web
      dockerfile: src/StockMarketBuyingGuide.Web/Dockerfile
    permissions:
      contents: read
      packages: write
